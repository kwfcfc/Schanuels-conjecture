name = "proof"
version = "0.1.0"
keywords = ["math", "transcendence-theory"]
defaultTargets = ["Schanuel"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.1"

[[lean_lib]]
name = "Schanuel"
roots = ["Schanuel", "Schanuel.Structural", "Schanuel.LindemannAttempt",
  "Schanuel.LindemannDenominators", "Schanuel.LindemannIntegralReduction",
  "Schanuel.DistinctFrequencies", "Schanuel.GaloisDescent",
  "Schanuel.GaloisStableRelation", "Schanuel.GaloisStableArithmetic",
  "Schanuel.LindemannStableEndpoint", "Schanuel.GaloisStableAnalytic2",
  "Schanuel.FractionAlgebraicIndependence", "Schanuel.RationalScaling",
  "Schanuel.AlgebraicInputs", "Schanuel.RelativeDescent",
  "Schanuel.ConfluentVandermonde", "Schanuel.MixedRadixJets",
  "Schanuel.AffineEndpointInterpolation", "Schanuel.AffineEndpointBoxJets",
  "Schanuel.MixedObstruction",
  "Schanuel.IteratedExponentialBoundary", "Schanuel.AlgebraicExponentialInputs",
  "Schanuel.PeriodLogBoundary", "Schanuel.IntegerShear",
  "Schanuel.TranscendentalReduction", "Schanuel.FullyTranscendentalReduction",
  "Schanuel.FullyTranscendentalAugmentation",
  "Schanuel.AlgebraicRanks", "Schanuel.RationalBasisInvariance",
  "Schanuel.ControlledMultipliers", "Schanuel.ControlledMultiplierBridge",
  "Schanuel.CanonicalHermiteTail", "Schanuel.CanonicalHermiteApproximation",
  "Schanuel.FullyTranscendentalMixedBoundary",
  "Schanuel.FullyTranscendentalPeriodBoundary", "Schanuel.MinimalCounterexample",
  "Schanuel.MinimalCounterexampleFullyTranscendental",
  "Schanuel.MinimalCounterexamplePeriodBearing",
  "Schanuel.CriticalPeriodEquality",
  "Schanuel.AdjacentPeriodDeletion",
  "Schanuel.AdjacentPeriodNormalForm",
  "Schanuel.CanonicalAnchorNormalForm",
  "Schanuel.CanonicalAnchorTerminalDichotomy",
  "Schanuel.CanonicalAnchorRelativeTerminal",
  "Schanuel.ConjugationStableNormalForm",
  "Schanuel.ConjugationStableMinimalFailure",
  "Schanuel.ConjugationStableTerminal",
  "Schanuel.ConjugationStableSectorBoundary",
  "Schanuel.DifferentialTransversality",
  "Schanuel.OrderSwitchObstruction",
  "Schanuel.MinimalCounterexampleRationalBasis",
  "Schanuel.MinimalCounterexampleUniformBoundary"]
