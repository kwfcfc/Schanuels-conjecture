name = "proof"
version = "0.1.0"
keywords = ["math", "transcendence-theory"]
defaultTargets = ["Schanuel"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.1"

[[lean_lib]]
name = "Schanuel"
roots = ["Schanuel", "Schanuel.Structural", "Schanuel.LindemannAttempt"]
